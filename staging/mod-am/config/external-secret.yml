---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: test-secret-secret
  namespace: mod-am-staging
spec:
  refreshInterval: "30s"
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: test-secret-secret
  dataFrom:
    - extract:
        key: staging/mod-am/test-secret

