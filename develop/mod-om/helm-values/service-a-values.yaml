deployment:
  name: service-a
  image: asia-southeast1-docker.pkg.dev/myorder-beta/kubernetes/mod-om/service-a
  tag: init
  dep:
    - deployment:
        subName: ""
        namespace: mod-om-dev
        replicas: 2
        resource:
          cpuRequest: 25m
          memoryRequest: 150Mi
          memoryLimit: 150Mi
        port: 8080
        hpa:
          enabled: true
      priorityClassName: tier-1
      labels:
        team: unknown
      liveness:
        isEnabled: true
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 5
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      readiness:
        isEnabled: true
        httpGet:
          path: /healthz
          port: 8080
        initialDelaySeconds: 10
        periodSeconds: 15
        timeoutSeconds: 5
        failureThreshold: 3
      volumes:
        GCLOUD:
          name: gcp-mod-om-svc
          mountPath: /etc/credentials-gcp
          secretName: gcp-mod-om-svc
      extraEnv:
        APP_ENV: 
        GOOGLE_APPLICATION_CREDENTIALS: /etc/credentials/gcp-mod-om-svc.json

        LOG_LEVEL: debug
        APP_ENV: beta
