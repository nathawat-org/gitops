apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mod-am-develop-application-set-test
  namespace: argo-cd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - SERVICE_NAME: account-management1-service
          # Disable HPA
          - SERVICE_NAME: account-management2-service
            HPA_ENABLED: false
          - SERVICE_NAME: account-management3-service
          - SERVICE_NAME: p-test-service
  template:
    metadata:
      name: >-
        {{ if (dig "SHORT_NAME" "" .)}}{{.SHORT_NAME}}{{else}}mod-am-{{.SERVICE_NAME}}{{end}}-v2-develop
      namespace: argo-cd
    spec:
      project: develop
      sources:
        - repoURL: https://myorder-intelligence.github.io/mod-helm-charts/
          targetRevision: >-
            {{dig "HELM_CENTRALIZE_VERSION" "1.12.18" .}}
          chart: mod-centralize-helm-charts-beta
          helm:
            releaseName: >-
              {{ if (dig "SHORT_NAME" "" .)}}{{.SHORT_NAME}}{{else}}mod-am-{{.SERVICE_NAME}}{{end}}-v2-develop
            valueFiles:
              - $values/develop/mod-am/helm-values/{{.SERVICE_NAME}}-values.yml
        - repoURL: https://github.cam/myorder-intelligence/mod-gitops-nonprod.git
          targetRevision: HEAD
          ref: values
      destination:
        name: develop
        namespace: mod-am
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
  templatePatch: |
    {{ if (dig "HPA_ENABLED" "false" .) }}
    spec:
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
          - /spec/replicas
    {{ end }}
